services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jambachat
      POSTGRES_PASSWORD: jambachat
      POSTGRES_DB: jambachat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jambachat"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://jambachat:jambachat@db:5432/jambachat
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
